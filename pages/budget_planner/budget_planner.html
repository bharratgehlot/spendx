<!-- This page help users create and manage their monthly budgets -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create, set target, manage your monthly budget"
    />
    <title>Budget Planner - SpendX</title>
    <link rel="stylesheet" href="budget_planner.css" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />

    <link
      rel="mask-icon"
      href="../../assets/favicon/safari-pinned-tab.svg"
      color="#5bbad5"
    />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />
  </head>

  <body>
    <div class="container" id="container">
      <h1 style="text-align: center">Budget Planner</h1>
      <div class="btn-container">
        <button id="newBudget">New</button>
        <button>MagicButton</button>
        <button>My Budgets</button>
        <button id="clearStorage">Clear</button>
      </div>
      <p style="text-align: center; color: white; background-color: crimson">
        Plan next month Budget
      </p>

      <button
        class="go-home-btn"
        onclick="window.location.href='../../index.html' "
      >
        Go to Home
      </button>
    </div>

    <!-- Main content here -->

    <!-- New Budget Model -->
    <div class="model-overlay" id="modelOverlay">
      <div class="model" id="budgetModel">
        <button class="model-close" id="modelClose">x</button>

        <div id="step1">
          <h2>New Budget</h2>
          <p class="step-label">Step 1 of 2 — Basic Info</p>

          <label>Budget Name</label>
          <input type="text" id="budgetName" placeholder="e.g. June Budget" />

          <label>Budget Month</label>
          <input type="month" id="budgetMonth" />

          <label>Target Amount (₹)</label>
          <input
            type="number"
            id="targetAmount"
            placeholder="e.g. 15,000rs"
            min="1000"
          />

          <p class="error-msg" id="step1Error"></p>
          <button class="model-btn" id="nextBtn">Next →</button>
        </div>
      </div>
    </div>

    <!-- Main content ends -->

    <!-- Google Analytics (disabled on localhost) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-G0Y921MTGZ"
    ></script>

    <script>
      const localhosts = ["localhost", "127.0.0.1", "127.0.0.2"];

      if (!localhosts.includes(window.location.hostname)) {
        // GA4 Tracking code

        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        gtag("js", new Date());
        gtag("config", "G-G0Y921MTGZ");
      } else {
        console.log("Google Analystics disabled for Local Enviornment");
      }
    </script>

    <script src="budget_planner.js"></script>
  </body>
</html>
