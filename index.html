<!--SpendX is a financial accountant tool that managees all of the users spending, debt, and reporting-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SpendX is a personal finance tracker to manage expenses, income, budgets, and savings."
    />
    <title>SpendX - Personal Finance Tracker</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"
    />
    
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="style.css" />

    <!-- Google tag for analysis purpose (disabled on localhost) -->

    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-G0Y921MTGZ"
    ></script>

    <script>
      const localhosts = ["localhost", "127.0.0.1", "127.0.0.2"];
      if (!localhosts.includes(window.location.hostname)) {
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        gtag("js", new Date());
        gtag("config", "G-G0Y921MTGZ");
      } else {
        console.log("Google Analytics disabled for local enviornment.");
      }
    </script>
  </head>

  <body>
    <div class="container" id="container">
      <div class="button-wrapper">
        <button id="toggleButton"></button>
      </div>

      <div class="settings-button-wrapper2">
        <button
          id="settingsButton"
          onclick="window.location.href='pages/user_settings/user_settings.html' "
        >
          ☰
        </button>
      </div>

      <h1>SpendX</h1>
      <div class="bal-container">
        <div class="balance-box">
          Bal: <span id="availableBalance"></span> Rs
        </div>
        <div class="balance-box" id="totalMoneySpent">
          Spent: <span id="totalSpentAmount"></span> Rs
        </div>
      </div>

      <a href="" class="app_notification">Rainy Moonsoon Update</a>

      <form id="expenseForm">
        <label for="userName">Name:</label>
        <input type="text" id="userName" name="userName" required />
        <label for="money">Money (INR):</label>
        <input type="number" id="money" name="money" required />
        <label for="description">Description:</label>
        <input type="text" id="description" name="description" required />
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required />
        <label for="location">Location:</label>
        <input type="text" id="location" name="location" />
        <label for="category">Category:</label>

        <select id="category" name="category">
          <option value="" selected disabled hidden>Select a category</option>
          <option value="Fuel">Fuel</option>
          <option value="Bills & Recharges">Bills & Recharges</option>
          <option value="Grocery & Kirana">Grocery & Kirana</option>
          <option value="Saag Sabji">Saag Sabji</option>
          <option value="Fruits">Fruits</option>
          <option value="Milk">Milk</option>
          <option value="Medical">Medical</option>
          <option value="Others">Others</option>
          <option value="Private">Private</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Donations">Donations</option>
        </select>
        <button type="submit" id="submitButton" class="submit-btn">
          Add Expense
        </button>
    
      </form>

        <button
        class="past-expenses-btn"
        onclick="window.location.href='pages/expenses/expenses.html';">
        Past Expenses</button

      ><br />

      <div class="link-container">
        <a href="pages/articles/dynamic_test.html" class="todaysread">Today's Read</a>
        <a href="pages/Budget_Planner/budget_planner.html" class="Budget_Planner"
          >Budget Planner</a
        >
      </div>
    </div>

    <script src="script.js"></script>

    <script>
      // Set default date to today
      window.addEventListener("DOMContentLoaded", function () {
        const dateInput = document.getElementById("date");
        if (dateInput) {
          const today = new Date();
          const yyyy = today.getFullYear();
          const mm = String(today.getMonth() + 1).padStart(2, "0");
          const dd = String(today.getDate()).padStart(2, "0");
          dateInput.value = `${yyyy}-${mm}-${dd}`;
        }
      });
    </script>

  </body>
</html>
